<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SubastasApp – Acceder</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="card login-card p-4">
      <div class="text-center mb-4">
        <i class="bi bi-hammer display-3 text-primary"></i>
        <h2 class="mt-2 fw-bold text-primary">SubastasApp</h2>
        <p class="text-muted mb-0">Plataforma de subastas en tiempo real</p>
      </div>

      <ul class="nav nav-tabs mb-3" id="authTabs" role="tablist">
        <li class="nav-item flex-fill text-center" role="presentation">
          <button class="nav-link active w-100" data-bs-toggle="tab" data-bs-target="#loginTab" type="button">
            <i class="bi bi-box-arrow-in-right"></i> Iniciar sesión
          </button>
        </li>
        <li class="nav-item flex-fill text-center" role="presentation">
          <button class="nav-link w-100" data-bs-toggle="tab" data-bs-target="#regTab" type="button">
            <i class="bi bi-person-plus"></i> Registrarse
          </button>
        </li>
      </ul>

      <div class="tab-content">
        <!-- Login -->
        <div class="tab-pane fade show active" id="loginTab" role="tabpanel">
          <div id="loginAlert"></div>
          <form id="loginForm" novalidate>
            <div class="mb-3">
              <label class="form-label fw-semibold">Usuario</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" id="loginUser" class="form-control" placeholder="Tu nombre de usuario"
                       autocomplete="username" required>
              </div>
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold">Contraseña</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" id="loginPass" class="form-control" placeholder="Tu contraseña"
                       autocomplete="current-password" required>
              </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">
              <i class="bi bi-box-arrow-in-right"></i> Entrar
            </button>
          </form>
        </div>

        <!-- Registro -->
        <div class="tab-pane fade" id="regTab" role="tabpanel">
          <div id="regAlert"></div>
          <form id="regForm" novalidate>
            <div class="mb-3">
              <label class="form-label fw-semibold">Nombre de usuario</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person-plus"></i></span>
                <input type="text" id="regUser" class="form-control" placeholder="Elige un nombre de usuario"
                       autocomplete="username" required>
              </div>
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold">Contraseña</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" id="regPass" class="form-control" placeholder="Elige una contraseña"
                       autocomplete="new-password" required>
              </div>
            </div>
            <button type="submit" class="btn btn-success w-100 py-2">
              <i class="bi bi-person-check"></i> Crear cuenta
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { getCurrentUser, initLoginPage } from '/js/auth.js';
    if (getCurrentUser()) {
      window.location.href = '/subastas.html';
    } else {
      initLoginPage();
    }
  </script>
</body>
</html>
